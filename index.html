<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 手機優先，一題一頁的卡片流程 → 結果頁（市長類型＋相符政見清單） */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --fg:#14283d; --muted:#5b6b78; --line:#d6dee3;
  --navy:#123a63; --green:#1d8a5a; --green-soft:#e2f2ea; --warm:#c8553d; --warm-soft:#f8e6e1;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#18242f; --fg:#e6edf2; --muted:#9aaab6; --line:#2b3a47;
  --navy:#8fb8e6; --green:#5cc795; --green-soft:#1c3a2d; --warm:#ec8b74; --warm-soft:#3d2620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#18242f; --fg:#e6edf2; --muted:#9aaab6; --line:#2b3a47;
  --navy:#8fb8e6; --green:#5cc795; --green-soft:#1c3a2d; --warm:#ec8b74; --warm-soft:#3d2620; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.brand b{color:var(--navy);letter-spacing:.06em}
h1{font-weight:900;font-size:clamp(30px,8vw,46px);line-height:1.15;margin:0;color:var(--navy);text-wrap:balance}
h1 em{font-style:normal;color:var(--green)}
.lead{margin:0;color:var(--muted);max-width:52ch}
.primary{background:var(--navy);color:var(--bg);border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:16px}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 16px;font-size:14px}
.ghost:disabled{opacity:.35;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);transition:width .3s}
.topic{font-size:13px;font-weight:700;color:var(--green);letter-spacing:.08em}
.scene{margin:0;font-size:17px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt::before{content:"";display:inline-block;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;margin-right:10px;vertical-align:-2px}
.opt[aria-pressed="true"]::before{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 3px var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--surface);font-weight:700;box-shadow:inset 4px 0 0 var(--navy)}
.nav{display:flex;justify-content:space-between;gap:10px}
.type{font-size:13px;color:var(--muted);letter-spacing:.1em}
.type-name{font-weight:900;font-size:clamp(24px,6.5vw,32px);line-height:1.25;color:var(--navy);margin:0}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .num{font-weight:900;font-size:clamp(44px,13vw,64px);line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.verdict{font-weight:900;font-size:clamp(19px,5vw,23px);line-height:1.4;margin:0;text-wrap:balance}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.list li{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.list li.ok{background:var(--green-soft)}
.list li.diff{background:var(--warm-soft)}
.list li.part{background:var(--bg);border:1px solid var(--line)}
.list li.part .t{color:var(--navy)}
.list .t{font-size:12px;font-weight:700;letter-spacing:.08em}
.list li.ok .t{color:var(--green)}
.list li.diff .t{color:var(--warm)}
.list .you{font-size:13px;color:var(--muted)}
.list .ho{font-size:14px}
h2{font-size:16px;margin:4px 0 0}
.note{font-size:12px;color:var(--muted);margin:0}
.note a{color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:inline-block;text-decoration:none;background:var(--green);color:var(--bg);border-radius:999px;padding:12px 24px;font-weight:700}
#result{display:flex;flex-direction:column;gap:22px}
footer{border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span>新竹 再勇敢一次</span><b>何志勇競選團隊</b></div>

  <section id="intro" class="card">

    <img src="preview.jpg" alt="何志勇競選形象圖" style="width:100%; height:auto; border-radius:12px; margin-bottom:4px;">
    <h1>何志勇是不是<em>你的好市長</em>？</h1>
    <p class="lead">十個新竹生活情境，每題選出你贊成的做法，可以複選。測出你心目中的市長類型，也看看何志勇的政見和你有多合。</p>
    <div class="row"><button class="primary" id="start" type="button">開始測驗</button><span class="note">約 2 分鐘，不收集任何個人資料</span></div>
  </section>

  <section id="quiz" class="card" hidden aria-live="polite">
    <div class="meta"><span id="qnum">1 / 10</span><div class="track"><i id="prog"></i></div></div>
    <div class="topic" id="topic"></div>
    <p class="scene" id="scene"></p>
    <p class="note" id="multi">可複選，選好後按「下一題」</p>
    <div class="opts" id="opts"></div>
    <div class="nav"><button class="ghost" id="back" type="button">上一題</button><button class="ghost" id="next" type="button" disabled>下一題</button></div>
  </section>

  <section id="result" hidden></section>

  <footer>
    <p class="note">本測驗由何志勇競選團隊製作，屬競選宣傳，非民意調查。何志勇的主張依其市政策白皮書《志慧新創，勇敢竹夢》整理；測驗不記錄、不上傳任何作答內容。</p>
  </footer>
</div>

<script>
// 每個做法：[文字, 是否為何志勇主張, 市長類型]  類型：B 建設、C 照顧、R 改革、S 穩健
// ho：何志勇在此議題的主張（白皮書）
const Q=[
 {t:"交通運輸",sc:"早上 7:40 從東區開往竹科，光復路塞到動彈不得。你贊成市府用哪些方式解決？",
  o:[["推動台鐵市區高架化，搭配 BRT 公車專用道",1,"B"],["導入 AI 智慧號誌，依車流即時調整",1,"R"],["興建新竹捷運，就算要等很多年",0,"B"],["優先拓寬瓶頸道路，讓開車更順",0,"S"]],
  ho:"台鐵市區段高架化（4 年動工、8 年完工）、公道五路／經國路／中華路 BRT、AI 智慧號誌，並增設立體停車場、推校園商圈行人優先區。"},
 {t:"居住",sc:"表妹剛到竹科上班，月薪 4 萬，附近套房一個月就要 1.8 萬。你希望市府怎麼幫她？",
  o:[["興建可負擔的社會住宅",1,"C"],["放寬並提高青年租屋補助",1,"C"],["鬆綁容積、加速民間都更",0,"B"],["房市交給市場，政府少介入",0,"S"]],
  ho:"興建可負擔多元社會住宅、放寬青年租屋補助，推動青銀共居。"},
 {t:"社會福利",sc:"市府今年多出一筆預算。你希望這筆錢怎麼用？",
  o:[["每人每年發生活支持金，鼓勵在地消費",1,"C"],["延長公托公幼照護時間、增加名額",1,"C"],["一次性普發現金給每位市民",0,"C"],["先拿去還債，不增加新支出",0,"S"]],
  ho:"首創每人每年 16,800 元生活支持金；公幼延長照護至晚間 7 點並增加公托量能。"},
 {t:"教育",sc:"孩子明年要上的學區國中一班 33 人，學校也沒什麼特色。你希望市府怎麼做？",
  o:[["熱門學區階段性增班，降低班級人數",1,"C"],["發展雙語與 STEAM 特色課程，校校有特色",1,"R"],["開放跨區選校，讓家長自由選",0,"R"],["維持現狀，避免教育政策一直變動",0,"S"]],
  ho:"鄭用錫計畫：熱門學區階段增班、校校有特色、真雙語與 STEAM，並為老師行政減負、提高導師費。"},
 {t:"治安",sc:"最近詐騙電話和巷口竊案都變多，你最希望市府怎麼做？",
  o:[["設跨局處治安辦公室，用 AI 預警與社區防詐",1,"R"],["盤點治安死角，改善照明與監視，結合社區巡守",1,"C"],["每條巷子都裝監視器，越多越好",0,"S"],["治安是警察的事，維持現有警力就好",0,"S"]],
  ho:"設跨局處治安辦公室，整合警政、教育、社政與科技，導入 AI 智慧預警、社區防詐及兒少安全網。"},
 {t:"城市發展",sc:"香山和頭前溪南岸有大片土地等待規劃。你希望怎麼做？",
  o:[["整體規劃成新竹副都心，搭配大型中央公園",1,"B"],["升級香山工業區，結合生態與節能減碳",1,"R"],["全部保留原狀，不要開發",0,"S"],["交給建商自由開發，越快越好",0,"B"]],
  ho:"打造新竹副都心，興建社宅與中央公園、發展香山；香山工業升級，打造台商回流特區。"},
 {t:"經濟就業",sc:"新竹有竹科和兩所頂尖大學，但年輕人創業還是很難。你覺得市府該做什麼？",
  o:[["活化閒置空間，串聯竹科與清大、陽交大做新創孵化",1,"R"],["發行市民回饋卡，讓錢留在在地店家",1,"C"],["用最大優惠吸引國際大廠進駐就好",0,"B"],["經濟交給中央和企業，市府不必插手",0,"S"]],
  ho:"市有閒置空間設新創孵化基地，串聯竹科、清大、陽交大，提供場域驗證與投資媒合；發行新竹市民回饋卡。"},
 {t:"高齡生活",sc:"爸媽退休了，敬老卡點數常常用不完，想要的服務又買不到。你希望市府怎麼改？",
  o:[["敬老卡點數自由配，讓長輩自己決定怎麼用",1,"R"],["推動在地安老，讓長輩住在熟悉的社區",1,"C"],["多蓋大型安養機構",0,"B"],["維持現行敬老卡制度就好",0,"S"]],
  ho:"敬老愛心卡點數自由配；推動在地安老、青銀共居。"},
 {t:"市政治理",sc:"新市長上任第一年，你希望他把力氣花在哪些地方？",
  o:[["重大標案公開、落實利益迴避，終結裙帶干政",1,"R"],["推市政透明儀表板，讓市民參與審預算",1,"R"],["先把市府債務還清，再談新計畫",0,"S"],["延續現在的施政，不要大改",0,"S"]],
  ho:"終結裙帶干政，重大標案檢調共同參與、落實利益迴避；文官治市、專業任用；市政透明儀表板、公民審議預算。"},
 {t:"文化城市",sc:"週末想帶家人出門，卻常覺得新竹沒地方去。你希望市府在文化上怎麼做？",
  o:[["串連古蹟與舊城，辦夜間展演，打造日文化、夜藝文",1,"B"],["發文化券、開免費體驗課，讓市民決定預算",1,"C"],["把預算集中在跨年等大型晚會",0,"B"],["文化活動交給民間，市府少花錢",0,"S"]],
  ho:"古蹟串連、走讀巴士、夜間展演，打造「日文化、夜藝文」；文化券、免費體驗課，千萬預算市民作主；展演空間升級國際規格。"},
];
const TYPES={
 B:["勇於建設的開路者","你希望市長敢做大建設，十年後回頭看，城市真的長出新樣子。"],
 C:["貼近生活的照顧者","你在乎每一個家庭過得好不好，市長要把照顧做到家門口。"],
 R:["打破慣例的改革者","你受夠了老方法，期待市長用新思維、新科技和透明治理改變市府。"],
 S:["精打細算的穩健派","你希望市長務實穩重，每一分錢都花在刀口上，不亂開支票。"],
};
const WEBSITE="https://chihyungho.github.io/";

const ans=Q.map(()=>[]);
const orders=Q.map(q=>q.o.map((_,j)=>j).sort(()=>Math.random()-.5));
let cur=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(i){
 cur=i;const q=Q[i];
 $("qnum").textContent=`${i+1} / ${Q.length}`;
 $("prog").style.width=(i/Q.length*100)+"%";
 $("topic").textContent=q.t;$("scene").textContent=q.sc;
 $("opts").innerHTML=orders[i].map(j=>`<button class="opt" type="button" data-j="${j}" aria-pressed="${ans[i].includes(j)}">${esc(q.o[j][0])}</button>`).join("");
 $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j,k=ans[i].indexOf(j);
  if(k>=0)ans[i].splice(k,1);else ans[i].push(j);
  b.setAttribute("aria-pressed",k<0);$("next").disabled=!ans[i].length;});
 $("back").disabled=i===0;
 $("next").disabled=!ans[i].length;
 $("next").textContent=i===Q.length-1?"看結果":"下一題";
}
function go(d){
 if(d>0&&!ans[cur].length)return;
 if(cur+d>=Q.length)return result();
 if(cur+d>=0)show(cur+d);
}
// 每題得分＝所選做法中屬於何志勇主張的比例
const qScore=i=>ans[i].filter(j=>Q[i].o[j][1]===1).length/ans[i].length;
function result(){
 const scores=Q.map((_,i)=>qScore(i));
 const pct=Math.round(scores.reduce((a,b)=>a+b,0)/Q.length*100);
 const tally={B:0,C:0,R:0,S:0};Q.forEach((q,i)=>ans[i].forEach(j=>tally[q.o[j][2]]++));
 const top=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
 const [tn,td]=TYPES[top];
 const verdict=pct>=70?"何志勇很可能就是你在找的好市長。"
  :pct>=40?"你和何志勇有不少共同點，看看他在其他議題上的做法。"
  :"你和何志勇在多數議題上想法不同，不妨看看他的完整政見再決定。";
 const group={ok:[],part:[],diff:[]};
 Q.forEach((q,i)=>{const sc=scores[i],cls=sc>.5?"ok":sc===.5?"part":"diff";
  const label={ok:"✓ 想法一致",part:"部分一致",diff:"想法不同"}[cls];
  const picks=orders[i].filter(j=>ans[i].includes(j)).map(j=>q.o[j][0]);
  group[cls].push(`<li class="${cls}"><span class="t">${label}・${q.t}</span>
   <span class="you">你選：${esc(picks.join("、"))}</span>
   <span class="ho">何志勇的主張：${esc(q.ho)}</span></li>`);});
 const sec=(k,h)=>group[k].length?`<h2>${h}（${group[k].length}）</h2><ul class="list">${group[k].join("")}</ul>`:"";
 $("quiz").hidden=true;
 $("result").hidden=false;
 $("result").innerHTML=`<div class="card">
   <div class="type">你心目中的好市長是</div>
   <p class="type-name">${tn}</p>
   <p style="margin:0">${td}</p>
  </div>
  <div class="card">
   <div class="score"><span class="num">${pct}%</span><span class="of">你和何志勇的想法一致</span></div>
   <p class="verdict">${verdict}</p>
   ${sec("ok","想法一致的議題")}${sec("part","部分一致的議題")}${sec("diff","想法不同的議題")}
   <p class="note">計分方式：每題依你所選的做法中，屬於何志勇主張的比例計分，再平均成百分比。</p>
   <div class="row"><a class="cta" href="${WEBSITE}" target="_blank" rel="noopener">看何志勇完整政見</a><button class="ghost" id="again" type="button">重新測驗</button></div>
  </div>`;
 $("again").onclick=()=>{ans.forEach(a=>a.length=0);$("result").hidden=true;$("quiz").hidden=false;show(0);window.scrollTo(0,0);};
 window.scrollTo(0,0);
}
$("start").onclick=()=>{$("intro").hidden=true;$("quiz").hidden=false;show(0);};
$("back").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
</script>
</body>
</html>
